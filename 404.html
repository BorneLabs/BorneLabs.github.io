<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta name="theme-color" content="#17191c">
  <title>404 - BorneLabs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/root.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <div class="layout-shell">
    <main class="main-shell" aria-label="404 page">
      <div class="main">
        <div class="content-root">
          <section class="page-header">
            <h1>404</h1>
          </section>

          <section class="page-section">
            <div class="card about-page-shell">
              <div class="text-center py-5 px-3">
                <div class="mb-3">
                  <span class="badge rounded-pill px-3 py-2" style="background: var(--accent-soft); color: var(--accent); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">
                    <i class="bi bi-exclamation-circle me-2"></i>Page Not Found
                  </span>
                </div>

                <h2 class="section-title mb-3">We couldn’t find that page.</h2>
                <p class="mb-4 text-muted mx-auto" style="max-width: 640px; line-height: 1.7;">
                  The page you requested may have moved, been removed, or the link may be incorrect.
                  Let’s get you back to the BorneLabs homepage.
                </p>

                <div class="d-flex flex-wrap justify-content-center gap-3">
                  <a class="btn btn-primary-custom" href="/">
                    <i class="bi bi-house-door me-2"></i>Back To Home
                  </a>
                  <a class="btn btn-outline-secondary" href="/projects">
                    <i class="bi bi-kanban me-2"></i>View Projects
                  </a>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
